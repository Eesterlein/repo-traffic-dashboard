name: Weekly summary

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays, ~8am Mountain time
  workflow_dispatch:

permissions: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # post the summary issue and close last week's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Post summary as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/weekly_summary.py > summary.md
          title=$(head -n 1 summary.md)
          tail -n +2 summary.md > body.md
          # Close last week's summary so only the latest stays open
          for n in $(gh issue list --label weekly-summary --state open --json number -q '.[].number'); do
            gh issue close "$n" --reason completed
          done
          gh issue create --title "$title" --body-file body.md --label weekly-summary
