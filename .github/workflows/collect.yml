name: Collect traffic

on:
  schedule:
    - cron: "17 6 * * *"   # daily, ~midnight Mountain time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch traffic for all public repos
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: python scripts/collect.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic.json
          git diff --cached --quiet || git commit -m "Update traffic data $(date -u +%F)"
          git push
